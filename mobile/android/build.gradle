// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  ext {
    // ⇩ Versionen synchron zu app/build.gradle (compile auf 35 angehoben wg. core-splashscreen)
    buildToolsVersion = "35.0.0"
    compileSdkVersion = 35
    targetSdkVersion = 34
    minSdkVersion = 24
    // RN-Template-Default; falls bei dir anders in gradle.properties gesetzt, kann das hier entfallen.
    ndkVersion = "26.1.10909125"
  }

  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    // Google Services (FCM etc.)
    classpath "com.google.gms:google-services:4.4.1"

    // Android Gradle Plugin (AGP 8.5.x kompatibel mit RN 0.73+/Expo SDK 51+)
    classpath "com.android.tools.build:gradle:8.5.2"

    // React Native Gradle Plugin
    classpath "com.facebook.react:react-native-gradle-plugin"

    // Kotlin Plugin – Version direkt angeben (keine ext.kotlinVersion Map)
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.24"
  }
}

def reactNativeAndroidDir = new File(
  providers.exec {
    workingDir(rootDir)
    commandLine("node", "--print", "require.resolve('react-native/package.json')")
  }.standardOutput.asText.get().trim(),
  "../android"
)

allprojects {
  repositories {
    // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
    maven { url(reactNativeAndroidDir) }

    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
