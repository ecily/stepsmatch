// android/app/build.gradle

plugins {
  id 'com.android.application'
  id 'com.facebook.react'
}

android {
    namespace 'com.stepsmatch'
    compileSdkVersion 34

    defaultConfig {
        applicationId 'com.stepsmatch'
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            shrinkResources true
            minifyEnabled true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    packagingOptions {
        resources {
            excludes += [
                    "META-INF/LICENSE",
                    "META-INF/LICENSE-FIREBASE.txt",
                    "META-INF/NOTICE",
                    "META-INF/NOTICE.txt",
                    "**/attach_hotspot_windows.dll"
            ]
        }
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])

    implementation 'androidx.core:core-splashscreen:1.0.1' // Für SplashScreen bei Expo SDK 52
    // Firebase & andere Abhängigkeiten werden durch Autolinking verwaltet
}

apply from: new File(["node", "--print", "require.resolve('expo/scripts/autolinking.gradle')"].execute(null, rootDir).text.trim())
