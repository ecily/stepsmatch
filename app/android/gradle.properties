# Project-wide Gradle settings.

org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m

android.useAndroidX=true
android.enableJetifier=true

reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64

# 🚫 Deactivate New Architecture
newArchEnabled=false
EXPERIMENTAL_ENABLE_NEW_ARCHITECTURE=false

# ✅ Enable Hermes (JS Engine)
hermesEnabled=true

# ✅ Enable Expo image formats
expo.gif.enabled=true
expo.webp.enabled=true
expo.webp.animated=false

# ✅ Network inspector for debugging
EX_DEV_CLIENT_NETWORK_INSPECTOR=true

# ✅ Use modern packaging (no legacy .so compression)
expo.useLegacyPackaging=false

# ✅ Set Kotlin version
android.kotlinVersion=1.7.10
kotlin.jvmTarget=17

# ✅ Explicitly disable Dev Client
EXPO_DEV_CLIENT=false

# ✅ Enable Dev Support (for Metro debugging etc.)
USE_DEVSUPPORT=true
