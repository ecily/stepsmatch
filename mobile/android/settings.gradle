// android/settings.gradle

pluginManagement {
    includeBuild(
        new File(
            ["node", "--print", "require.resolve('@react-native/gradle-plugin/package.json', { paths: [require.resolve('react-native/package.json')] })"]
                .execute(null, rootDir)
                .text
                .trim()
        ).getParentFile().toString()
    )
}

plugins {
    id("com.facebook.react.settings")
}

rootProject.name = 'stepsmatch'

dependencyResolutionManagement {
    versionCatalogs {
        reactAndroidLibs {
            from(
                files(
                    new File(
                        ["node", "--print", "require.resolve('react-native/package.json')"]
                            .execute(null, rootDir)
                            .text
                            .trim(),
                        "../gradle/libs.versions.toml"
                    )
                )
            )
        }
    }
}

// Wichtig: Dieser Pfad **muss auf eine GRADLE-Datei zeigen**, nicht auf ein Verzeichnis!
apply from: new File(
    ["node", "--print", "require.resolve('expo/package.json')"]
        .execute(null, rootDir)
        .text
        .trim()
).getParentFile().toPath().resolve("../scripts/autolinking.gradle").toFile()

useExpoModules()

include ':app'

includeBuild(
    new File(
        ["node", "--print", "require.resolve('@react-native/gradle-plugin/package.json', { paths: [require.resolve('react-native/package.json')] })"]
            .execute(null, rootDir)
            .text
            .trim()
    ).getParentFile()
)
