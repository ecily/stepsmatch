# Project-wide Gradle settings.

# JVM/GC: mehr Puffer für AGP 8.x, RN 0.73+ und Java 17 Toolchain
# (UTF-8 verhindert Encoding-Issues bei Codegen/Resourcen)
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8

# Optionale Performance-Booster (stabil mit Multi-Module RN/Expo)
org.gradle.parallel=true
org.gradle.configureondemand=true

# AndroidX
android.useAndroidX=true

# PNG crunching
android.enablePngCrunchInReleaseBuilds=true

# (AGP 8+: default nonTransitive; explizit für Konsistenz)
android.nonTransitiveRClass=true

# Archs (kannst du bei Bedarf ausdünnen)
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64

# Neue Architektur (TurboModules/Fabric)
newArchEnabled=true

# Hermes statt JSC
hermesEnabled=true

# Expo: Medienformate
expo.gif.enabled=true
expo.webp.enabled=true
expo.webp.animated=false

# Dev Client Network Inspector
EX_DEV_CLIENT_NETWORK_INSPECTOR=true

# Packaging
expo.useLegacyPackaging=false

# Edge-to-Edge
expo.edgeToEdgeEnabled=true

# (Optional – falls du ProGuard/R8/Bundle-Compression über Properties steuern willst)
# android.enableProguardInReleaseBuilds=false
# android.enableShrinkResourcesInReleaseBuilds=false
# android.enableBundleCompression=false
