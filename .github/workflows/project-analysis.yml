name: 🔍 Project Analysis

on:
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout via Token
        uses: actions/checkout@v4
        with:
          repository: ecily/stepsmatch
          token: ${{ secrets.CLONE_URL }}
          fetch-depth: 1

      - name: 📁 Struktur anzeigen (tree)
        run: |
          mkdir -p analysis
          echo '# Projektstruktur (`tree -L 3`)' > analysis/overview.md
          tree -L 3 -h >> analysis/overview.md

      - name: 🧪 Analyse package.json
        run: |
          echo -e '\n---\n## 📦 Abhängigkeiten' >> analysis/overview.md
          if [ -f mobile/package.json ]; then
            echo -e '\n### mobile/package.json\n' >> analysis/overview.md
            cat mobile/package.json >> analysis/overview.md
          fi
          if [ -f frontend/package.json ]; then
            echo -e '\n### frontend/package.json\n' >> analysis/overview.md
            cat frontend/package.json >> analysis/overview.md
          fi
          if [ -f backend/package.json ]; then
            echo -e '\n### backend/package.json\n' >> analysis/overview.md
            cat backend/package.json >> analysis/overview.md
          fi

      - name: 🚀 Commit Analyse-Ergebnis
        run: |
          git config user.name "stepsmatch-analyzer"
          git config user.email "analyzer@stepsmatch.com"
          git add analysis/overview.md
          git commit -m "🧾 Projektanalyse automatisch erstellt"
          git push
